name: "Release Suite with Poccham AI"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            os_name: "windows"
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            os_name: "macos-arm64"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            os_name: "macos-x64"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            os_name: "linux"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. リポジトリ内のZIPファイルを自動検出して解凍（zip1つとymlだけで動く仕組み）
      - name: Extract Project ZIP if present
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found project archive: $ZIP_FILE. Extracting..."
            mkdir -p extracted_temp
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              powershell -Command "Expand-Archive -Path '$ZIP_FILE' -DestinationPath extracted_temp -Force"
            else
              unzip -q "$ZIP_FILE" -d extracted_temp
            fi
            
            # サブディレクトリに包まれていても直下に展開
            if [ -d "extracted_temp/suite-with-poccham-ai" ]; then
              cp -rf extracted_temp/suite-with-poccham-ai/* .
              cp -rf extracted_temp/suite-with-poccham-ai/.* . 2>/dev/null || true
            else
              cp -rf extracted_temp/* .
              cp -rf extracted_temp/.* . 2>/dev/null || true
            fi
            rm -rf extracted_temp
            echo "Project files extracted successfully."
          fi

      # 2. アイコン自動生成（アプリアイコンの手動準備・アップロードを不要化）
      - name: Ensure App Icons Exist (Auto-Generate if missing)
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          python3 - << 'EOF'
          import os
          icons_dir = "src-tauri/icons"
          if os.path.exists(f"{icons_dir}/icon.png") and os.path.exists(f"{icons_dir}/icon.ico"):
              print("Icons already present, skipping generation.")
              exit(0)

          try:
              from PIL import Image, ImageDraw
          except ImportError:
              import subprocess, sys
              subprocess.check_call([sys.executable, "-m", "pip", "install", "Pillow"])
              from PIL import Image, ImageDraw

          def generate_clean_icon(size):
              img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              margin = int(size * 0.05)
              radius = int(size * 0.22)
              # ミニマルで上品なOfficeネイビー
              draw.rounded_rectangle(
                  [margin, margin, size - margin, size - margin],
                  radius=radius,
                  fill=(15, 23, 42, 255),
                  outline=(56, 189, 248, 255),
                  width=max(1, int(size * 0.03))
              )
              p_x = int(size * 0.32)
              p_y = int(size * 0.25)
              p_w = int(size * 0.36)
              p_h = int(size * 0.5)
              stem_w = max(2, int(size * 0.1))
              draw.rectangle([p_x, p_y, p_x + stem_w, p_y + p_h], fill=(255, 255, 255, 255))
              loop_h = int(p_h * 0.6)
              draw.rounded_rectangle([p_x, p_y, p_x + p_w, p_y + loop_h], radius=int(loop_h*0.4), fill=(255, 255, 255, 255))
              draw.rounded_rectangle([p_x + stem_w, p_y + stem_w, p_x + p_w - stem_w, p_y + loop_h - stem_w], radius=int(loop_h*0.25), fill=(15, 23, 42, 255))
              return img

          icon_512 = generate_clean_icon(512)
          icon_512.save(f"{icons_dir}/icon.png")
          icon_512.resize((32, 32)).save(f"{icons_dir}/32x32.png")
          icon_512.resize((128, 128)).save(f"{icons_dir}/128x128.png")
          icon_512.resize((256, 256)).save(f"{icons_dir}/128x128@2x.png")
          icon_512.save(f"{icons_dir}/icon.ico", format="ICO", sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
          icon_512.save(f"{icons_dir}/icon.icns", format="PNG")
          print("App icons automatically generated.")
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux Build Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake \
            clang \
            pkg-config

      - name: Setup CMake & Ninja (Windows)
        if: matrix.platform == 'windows-latest'
        uses: ashutoshvarma/setup-ninja@master

      - name: Install Frontend Dependencies
        run: npm install

      # Tauri Action で全OS向けのインストーラーをビルド (.msi, .exe/NSIS, .dmg, .AppImage, .deb)
      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Suite with Poccham AI ${{ github.ref_name }}"
          releaseBody: |
            ## Suite with Poccham AI ${{ github.ref_name }}
            
            Ultra-fast, 100% offline & local-first Next-Gen Office Suite integrated with Poccham AI.
            
            ### Included Assets:
            - **Windows**: Installer (`.exe` NSIS / `.msi`) & Portable standalone (`.exe` / `.zip`)
            - **macOS**: Apple Silicon (`aarch64`) & Intel (`x64`) (`.dmg`)
            - **Linux**: Portable (`.AppImage`) & Debian (`.deb`)
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # Windows 単体起動ポータブル版 (.exe) の抽出 & ZIP圧縮
      - name: Package Windows Portable Executable
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist-portable
          cp src-tauri/target/${{ matrix.target }}/release/suite-with-poccham-ai.exe dist-portable/Suite-with-Poccham-AI-Portable.exe
          cd dist-portable
          powershell -Command "Compress-Archive -Path Suite-with-Poccham-AI-Portable.exe -DestinationPath Suite-with-Poccham-AI-Portable-Windows-x64.zip -Force"

      # ポータブル版を GitHub Releases へ追加アップロード
      - name: Upload Windows Portable Artifact to Release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-portable/Suite-with-Poccham-AI-Portable-Windows-x64.zip
            dist-portable/Suite-with-Poccham-AI-Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
